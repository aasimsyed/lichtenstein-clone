<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R2 Image Test</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; max-width: 800px; margin: 0 auto; padding: 20px; }
    h1 { color: #333; }
    .image-list { display: flex; flex-wrap: wrap; gap: 20px; }
    .image-item { border: 1px solid #ddd; padding: 10px; width: 200px; }
    .image-item img { max-width: 100%; height: auto; display: block; }
    .metadata { font-size: 0.8rem; color: #666; margin-top: 5px; }
    button { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0051a2; }
    #error { color: red; }
    #loading { color: blue; }
  </style>
</head>
<body>
  <h1>R2 Image Test</h1>
  
  <div>
    <button id="loadImages">Load Images from R2</button>
    <p id="loading" style="display: none;">Loading images...</p>
    <p id="error" style="display: none;"></p>
  </div>
  
  <div id="imageList" class="image-list"></div>
  
  <script>
    const workerUrl = 'https://r2-image-worker.aasim-ss.workers.dev';
    
    document.getElementById('loadImages').addEventListener('click', async () => {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const imageListEl = document.getElementById('imageList');
      
      loadingEl.style.display = 'block';
      errorEl.style.display = 'none';
      imageListEl.innerHTML = '';
      
      try {
        // Fetch the list of images from the R2 worker
        const response = await fetch(`${workerUrl}/?list=true`);
        
        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        if (!data.objects || !Array.isArray(data.objects)) {
          throw new Error('Invalid response format');
        }
        
        loadingEl.style.display = 'none';
        
        if (data.objects.length === 0) {
          imageListEl.innerHTML = '<p>No images found in the R2 bucket.</p>';
          return;
        }
        
        // Display the images
        data.objects.forEach(obj => {
          const div = document.createElement('div');
          div.className = 'image-item';
          
          const img = document.createElement('img');
          img.src = `${workerUrl}/${obj.key}`;
          img.alt = obj.key;
          img.loading = 'lazy';
          
          const metadata = document.createElement('div');
          metadata.className = 'metadata';
          metadata.textContent = `${obj.key} (${formatSize(obj.size)})`;
          
          div.appendChild(img);
          div.appendChild(metadata);
          imageListEl.appendChild(div);
        });
      } catch (error) {
        loadingEl.style.display = 'none';
        errorEl.textContent = `Error loading images: ${error.message}`;
        errorEl.style.display = 'block';
        console.error('Error fetching images:', error);
      }
    });
    
    // Helper function to format file size
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
  </script>
</body>
</html>
