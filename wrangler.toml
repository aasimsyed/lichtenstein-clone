name = "r2-image-worker"
main = "r2-worker.js"
compatibility_date = "2022-11-30"
compatibility_flags = ["nodejs_compat"]
compatibility_version = "1"
node_compat = true
workers_dev = true

# Specify Node.js compatibility version for Pages
[build]
node_version = "20"

[triggers]
crons = []

# Bind the R2 bucket
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "better-badges"
preview_bucket_name = "better-badges"

# Set environment variables that will be available to the Worker
[vars]
# This will be available as env.R2_ENDPOINT in the Worker
R2_ENDPOINT = "https://950035267d1186d83269e8b8eb50e572.r2.cloudflarestorage.com"

# Optional: Configure the worker to be a custom domain
# Uncomment and replace with your domain when ready
# [[routes]]
# pattern = "images.better-badges.com/*"
# zone_name = "better-badges.com"